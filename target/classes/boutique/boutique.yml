# ── Boutique /pbshop ──────────────────────────────────────────────────────────
boutique:
  titre: "&c&lBoutique RedConflict"

  # ── Annonce des achats ──────────────────────────────────────────────────────
  # Diffusée à tout le serveur, quel que soit le chemin de l'achat : comptoir en
  # jeu, offre spéciale, ou boutique du site. Taire les achats web aurait donné
  # l'impression d'une boutique deux fois moins vivante qu'elle ne l'est.
  #
  # Vide = aucune annonce. C'est le réglage à choisir si la boutique tourne
  # beaucoup : un chat noyé sous les annonces finit par être coupé.
  #
  # %player% %article% %duree%
  annonce: "&7[&c✦&7] &f%player% &7vient d'acheter &c%article% &7%duree% !"
  annonce_a_vie: "&8(à vie)"
  annonce_temporaire: "&8(30 jours)"

  # Chaque grade pose le groupe LuckPerms ET les permissions listees dans sa
  # description : ce qui est annonce dans /boutique est exactement ce qui est
  # donne, meme si le groupe n'est pas (encore) configure cote LuckPerms.
  # Achat temporaire -> "commandes" (settemp %duree%), permanent -> "commandes_perm".
  grades:
    - id: "elite"
      nom: "&b&lGrade Elite"
      icone: DIAMOND
      description:
        - "&7Commandes : &f/back &7/craft &7/furnace &7/vision"
        - "&7Homes : &f6 &7(au lieu de 1)"
        - "&7Kit : &f/kit elite"
        - "&8Grade intermediaire du serveur"
      commandes:
        - "lp user %player% permission settemp group.elite true %duree%"
        - "lp user %player% permission settemp redconflict.back true %duree%"
        - "lp user %player% permission settemp redconflict.craft true %duree%"
        - "lp user %player% permission settemp redconflict.furnace true %duree%"
        - "lp user %player% permission settemp redconflict.nv true %duree%"
        - "lp user %player% permission settemp redconflict.sethome.multiple.6 true %duree%"
        - "lp user %player% permission settemp greatkits.kits.Elite true %duree%"
      commandes_perm:
        - "lp user %player% permission set group.elite true"
        - "lp user %player% permission set redconflict.back true"
        - "lp user %player% permission set redconflict.craft true"
        - "lp user %player% permission set redconflict.furnace true"
        - "lp user %player% permission set redconflict.nv true"
        - "lp user %player% permission set redconflict.sethome.multiple.6 true"
        - "lp user %player% permission set greatkits.kits.Elite true"
      prix_monnaie: 30000
      prix_pb: 50
      prix_monnaie_perm: 100000
      prix_pb_perm: 150
      duree: 2592000
    - id: "immortel"
      nom: "&6&lGrade Immortel"
      icone: NETHER_STAR
      description:
        - "&7Tout le grade Elite, et en plus :"
        - "&7Commandes : &f/near &7/ec &7/repairall &7/feed"
        - "&7Homes : &f10 &7- Kit : &f/kit immortel"
        - "&8Grade premium - le plus eleve du serveur"
      commandes:
        - "lp user %player% permission settemp group.immortel true %duree%"
        - "lp user %player% permission settemp redconflict.back true %duree%"
        - "lp user %player% permission settemp redconflict.craft true %duree%"
        - "lp user %player% permission settemp redconflict.furnace true %duree%"
        - "lp user %player% permission settemp redconflict.nv true %duree%"
        - "lp user %player% permission settemp redconflict.near true %duree%"
        - "lp user %player% permission settemp redconflict.near.unlimited true %duree%"
        - "lp user %player% permission settemp redconflict.ec true %duree%"
        - "lp user %player% permission settemp redconflict.repair true %duree%"
        - "lp user %player% permission settemp redconflict.feed true %duree%"
        - "lp user %player% permission settemp redconflict.sethome.multiple.10 true %duree%"
        - "lp user %player% permission settemp greatkits.kits.Immortel true %duree%"
      commandes_perm:
        - "lp user %player% permission set group.immortel true"
        - "lp user %player% permission set redconflict.back true"
        - "lp user %player% permission set redconflict.craft true"
        - "lp user %player% permission set redconflict.furnace true"
        - "lp user %player% permission set redconflict.nv true"
        - "lp user %player% permission set redconflict.near true"
        - "lp user %player% permission set redconflict.near.unlimited true"
        - "lp user %player% permission set redconflict.ec true"
        - "lp user %player% permission set redconflict.repair true"
        - "lp user %player% permission set redconflict.feed true"
        - "lp user %player% permission set redconflict.sethome.multiple.10 true"
        - "lp user %player% permission set greatkits.kits.Immortel true"
      prix_monnaie: 75000
      prix_pb: 100
      prix_monnaie_perm: 250000
      prix_pb_perm: 250
      duree: 2592000

  # Une entree = la permission reellement testee par la commande du Core
  # (voir plugin.yml, section "commands"). Ne pas mettre de noeud essentials.* :
  # le module Essentials est integre au Core et n'utilise que redconflict.*.
  commandes:
    - id: "ec"
      nom: "&5Commande /ec"
      icone: ENDER_CHEST
      description:
        - "&7Ouvrez votre EnderChest partout"
        - "&8Permission : redconflict.ec"
      commande: "lp user %player% permission settemp redconflict.ec true %duree%"
      commande_perm: "lp user %player% permission set redconflict.ec true"
      prix_monnaie: 5000
      prix_pb: 50
      prix_monnaie_perm: 25000
      prix_pb_perm: 250
      duree: 2592000
    - id: "craft"
      nom: "&bCommande /craft"
      icone: crafting_table
      description:
        - "&7Table de craft virtuelle partout"
        - "&8Permission : redconflict.craft"
      commande: "lp user %player% permission settemp redconflict.craft true %duree%"
      commande_perm: "lp user %player% permission set redconflict.craft true"
      prix_monnaie: 3000
      prix_pb: 30
      prix_monnaie_perm: 15000
      prix_pb_perm: 150
      duree: 2592000
    - id: "furnace"
      nom: "&eCommande /furnace"
      icone: FURNACE
      description:
        - "&7Cuit vos items sans four"
