# ── Récompenses de vote ───────────────────────────────────────────────────────
#
# Azuriom n'appelle qu'une seule commande, une fois le vote validé :
#
#     rcvote {player}
#
# à déclarer dans Administration → Vote → Récompenses, champ « commandes ».
# Ne mets RIEN dans le champ « monnaie » de cette récompense : les PB sont
# donnés ici, sinon le joueur serait crédité deux fois.
#
# Pourquoi ce détour plutôt que des commandes directes : un `give` envoyé à la
# console ne connaît pas les items propres au serveur (RUBY_SWORD, COBALT_KEY…)
# et livrerait du vide. Le Core les distribue par l'API Bukkit — le même code que
# la boutique.
#
# Après modification : /rcvote reload
#
# ── LE BUDGET (à relire avant de toucher aux chiffres) ────────────────────────
#
# Le vote est ouvert toutes les 3 h : 8 votes/jour au maximum, ~240 par mois pour
# un joueur qui ne rate jamais un créneau. Tout ce qu'on met ici se multiplie
# donc par 240, pas par 1.
#
# PB — 100 PB = 10 €, soit 0,10 € l'unité. Aucun PB n'est accordé
# automatiquement : ils ne tombent que sur deux lots rares.
#     bonus-pb  2,0 %  x  5 PB  = 0,10 PB/vote
#     jackpot   0,5 %  x 20 PB  = 0,10 PB/vote   (20 PB = le plafond d'un lot)
#     ---------------------------------------------------------------
#     esperance ~ 0,20 PB/vote, soit 1,6 PB/jour au maximum theorique et
#     ~4,80 € par mois pour un voteur parfaitement assidu. C'est la limite
#     qu'on s'autorise.
#
#     Repere pour retoucher : passer vote.pb a 1 (PB garanti a chaque vote)
#     couterait a lui seul 8 PB/jour, soit ~24 € par mois et par voteur assidu.
#     D'ou le 0.
#
# Argent — echelle du shop : un diamant s'achete 10 000$ et se revend 7 500$,
# une emeraude 6 000$. Les montants ci-dessous se lisent donc en fractions de
# diamant, pas en euros.
#     esperance ~ 1 200$/vote, soit ~10 000$/jour au maximum : un diamant.
#
# Items — rien qui concurrence la boutique : pas d'epee Cobalt, pas d'armure,
# des enchantements de bas niveau. Le vote depanne, il n'equipe pas.

vote:
  # Accordés à chaque vote, quoi qu'il arrive. Volontairement à 0 : voir le budget
  # PB ci-dessus. Les PB passent par les lots « bonus-pb » et « jackpot ».
  pb: 0

  # %pb% et %lots% sont remplacés. Vide = aucun message.
  # %pb% n'est pas affiché ici : il vaut 0 la plupart du temps, et les lots qui
  # en donnent l'annoncent déjà par leur nom.
  message: "&a✔ Merci d'avoir voté ! &7%lots%"

  # Annonce à tout le serveur. Vide = pas d'annonce.
  annonce: "&7[&c✦&7] &f%player% &7vient de voter. &8/vote"

  # ── Butin ───────────────────────────────────────────────────────────────────
  #
  # Un tirage par vote, pondéré. Le « poids » est relatif : la somme fait 1000,
  # donc un poids se lit en pour mille — poids 310 = 31,0 %, poids 5 = 0,5 %.
  # Cette échelle (plutôt que 100) sert à écrire des raretés sous le pourcent.
  #
  # Un poids de 0 retire le lot du tirage sans le supprimer : il reste
  # accessible à « garantie.lot » (voir « fidelite » en bas de liste).
  #
  # Les commandes acceptent %player% et %uuid%. Trois formes sont utiles ici :
  #   give <joueur> <ITEM[:data]> [quantité] [enchantement niveau …]  -> inventaire
  #   eco give <joueur> <montant>                                     -> argent
  #   pb: <n> (champ du lot, pas une commande)                        -> Points Boutique
  #
  # « eco give » fonctionne hors ligne (le solde vit en base) ; les « give »
  # attendent la connexion du joueur — le Core met le lot de côté tout seul.
  tirages: 1

  lots:
    - id: "argent-modeste"
      poids: 17             # 20,0 %
      nom: "&a1 200$"
      commandes:
        - "eco give %player% 1200"

    - id: "ravitaillement"
      poids: 200            # 20,0 %
      nom: "&e8 pommes dorées &7"
      commandes:
        - "give %player% GOLDEN_APPLE 8"

    - id: "cle-acier"
      poids: 120            # 10,0 %
      nom: "&fUne clé en Acier"
      commandes:
        - "give %player% STEEL_KEY 1"

    - id: "materiaux"
      poids: 110            # 10,0 %
      nom: "&52 stack d'obsidiennes &7"
      commandes:
        - "give %player% OBSIDIAN 128"

    - id: "kit-potions"
      poids: 100            # 10,0 %
      nom: "&dKit potions"
      commandes:
        - "kit %player% potion"

    - id: "kit-bonus"
      poids: 100            # 10,0 %
      nom: "&dKit Bonus"
      commandes:
        - "kit %player% Bonus"

    # ── Le palier « bonne pioche » ────────────────────────────────────────────
    - id: "argent-gros"
      poids: 70             # 7,0 %
      nom: "&a&l6 000$"
      commandes:
        - "eco give %player% 6000"

    - id: "cle-emeraude"
      poids: 40             # 4,0 %
      nom: "&aUne clé en Émeraude"
      commandes:
        - "give %player% EMERALD_KEY 1"

    - id: "bonus-pb"
      poids: 20             # 2,0 %
      nom: "&b5 Points Boutique"
      pb: 5
      commandes:
        - "pb add %player% 5"

    # ── Le rare ───────────────────────────────────────────────────────────────
    - id: "epee-ruby"
      poids: 2              # 3,0 %
      nom: "&cUne épée Ruby &7(Tranchant II)"
      commandes:
        - "give %player% RUBY_SWORD 1 sharpness 2"

    - id: "cle-ruby"
      poids: 10             # 2,0 %
      nom: "&cUne clé en Ruby"
      commandes:
        - "give %player% RUBY_KEY 1"

    - id: "jackpot"
      poids: 5              # 2,0 %
      nom: "&6&lJACKPOT &7— 20 000$, une clé Cobalt et 20 PB"
      # Plafond assumé : 20 PB, soit 2 € de valeur boutique.
      pb: 20
      commandes:
        - "eco give %player% 20000"
        - "give %player% COBALT_KEY 1"
        - "pb add %player% 20"

    # ── Hors tirage (poids 0) : réservé à la garantie de fidélité ─────────────
    - id: "fidelite"
      poids: 0
      nom: "&6Coffre de fidélité &7— clé Ruby, 8 000$ et 8 pommes dorées"
      # Pas de PB ici : tous les 25 votes, ça ferait un revenu régulier en euros.
      commandes:
        - "eco give %player% 8000"
        - "give %player% RUBY_KEY 1"
        - "give %player% GOLDEN_APPLE 8"

  # ── Garantie ────────────────────────────────────────────────────────────────
  #
  # Tous les N votes, un lot est accordé EN PLUS du tirage. C'est ce qui rend la
  # régularité payante sans dépendre de la chance — et ce qu'une table de butin
  # seule ne sait pas faire.
  #
  # 25 votes : environ 3 jours pour un voteur maximal, une à deux semaines en
  # pratique. Baisser ce nombre revient à augmenter le budget — le coffre est
  # distribué « 1 / tous_les » fois par vote.
  #
  # tous_les: 0 pour désactiver.
  garantie:
    tous_les: 25
    lot: "fidelite"
    message: "&6✦ &e%total%e vote ! &7Récompense de fidélité : %lot%"
