# ═══════════════════════════════════════════════════════════════════════════
#  SUCCÈS — catalogue
# ═══════════════════════════════════════════════════════════════════════════
#
#  Chaque entrée est un objectif chiffré et sa récompense. La clé (« mine-
#  obsidian-64 ») est l'identifiant : il part en base et sur le fil, et
#  RENOMMER UNE CLÉ EFFACE L'AVANCEMENT de tous les joueurs qui l'avaient.
#  Changer un nom d'affichage, une description, un objectif ou une récompense
#  est en revanche sans danger.
#
#  ── Champs ────────────────────────────────────────────────────────────────
#  name         nom affiché
#  description  ce qu'il faut faire, à l'impératif
#  category     MINAGE · ARTISANAT · COMBAT · ECONOMIE · DIVERS
#               (l'ordre des onglets du menu suit l'ordre d'apparition ici)
#  tier         0 facile · 1 moyen · 2 difficile · 3 extrême
#  trigger      quel compteur avance — voir la liste ci-dessous
#  target       matériau ou métier, selon le déclencheur
#  goal         valeur à atteindre
#  reward.money argent versé à la récupération
#  reward.items MATERIAL:quantité:data|ENCHANT=niveau|ENCHANT=niveau
#
#  ── Déclencheurs ──────────────────────────────────────────────────────────
#  BLOCK_MINE <matériau>   bloc cassé (un bloc posé par un joueur ne compte pas)
#  BLOCK_PLACE <matériau>  bloc posé
#  CRAFT <matériau>        objet fabriqué
#  CONSUME <matériau>      nourriture ou potion consommée
#  ENCHANT                 enchantement appliqué à la table
#  DEATH                   mort du joueur
#  KILL_PLAYER             joueur tué
#  KILLSTREAK              plus longue série sans mourir (record, pas un cumul)
#  HDV_BUY / HDV_SELL      objets achetés / vendus à l'hôtel des ventes
#  MONEY_SPENT             argent dépensé, toutes boutiques confondues
#  JOB_LEVEL <métier|ANY>  niveau de métier atteint (record)
#  PLAYTIME_MIN            minutes de jeu (total relevé sur le compteur du
#                          serveur, celui de /profil — donc rétroactif)
#
#  Une entrée dont le matériau n'existe pas sur ce serveur est ignorée au
#  chargement, avec un avertissement dans la console. C'est ce qui permet de
#  garder les succès sur le rubis et le cobalt dans un fichier partagé avec
#  un serveur qui ne les a pas.
# ═══════════════════════════════════════════════════════════════════════════

