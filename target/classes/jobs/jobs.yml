# ╔══════════════════════════════════════════════════════════════════╗
# ║       OriginsFightCore — Système de Métiers (jobs.yml)         ║
# ╚══════════════════════════════════════════════════════════════════╝

max-levels: 50

# Formule XP : xp_required(level) = floor(base * pow(factor, level - 1))
# Niv 1 → 400 | Niv 10 → ~1 520 | Niv 20 → ~6 710 | Niv 30 → ~29 600 | Niv 50 → ~576 800
xp-formula:
  base: 400
  factor: 1.16

# Formule argent : money(level) = floor(money-base * pow(money-factor, level - 1))
# Valeurs faibles intentionnellement — les milestones (×5) sont les vraies récompenses.
money-formula:
  base: 40
  factor: 1.10

# ── Paliers ──────────────────────────────────────────────────────────────────
# Bornes de niveau de chaque palier. L'ORDRE compte : chaque action ci-dessous
# définit une valeur d'XP par palier (1 valeur par entrée de cette liste).
# Toutes les sources sont toujours farmables ; seule l'XP varie selon ton palier.
tiers:
  - { name: "Débutant",   min: 1,  max: 5  }
  - { name: "Apprenti",   min: 6,  max: 10 }
  - { name: "Confirmé",   min: 11, max: 20 }
  - { name: "Expert",     min: 21, max: 30 }
  - { name: "Maître",     min: 31, max: 40 }
  - { name: "Légendaire", min: 41, max: 50 }

# ── XP par action et par palier ──────────────────────────────────────────────
# Chaque valeur est une liste de 6 nombres (1 par palier, dans l'ordre ci-dessus).
# Une liste plus courte est complétée par sa dernière valeur ; un scalaire est
# appliqué à tous les paliers.
jobs:

  MINER:
    display: "Mineur"
    color: "§7"
    description: "Extrais des minerais pour gagner de l'expérience"
    actions:
      # Clé = nom Material Bukkit (ou MATERIAL:META pour les blocs custom)
      #                  I   II  III IV  V   VI
      COAL_ORE:        [ 5,  6,  7,  8,  9,  10 ]
      IRON_ORE:        [ 12, 13, 15, 17, 19, 21 ]
      LAPIS_ORE:       [ 15, 16, 18, 20, 22, 24 ]
      REDSTONE_ORE:    [ 15, 16, 18, 20, 22, 24 ]
      QUARTZ_ORE:      [ 18, 20, 22, 24, 26, 28 ]
      GOLD_ORE:        [ 20, 22, 25, 28, 31, 34 ]
      EMERALD_ORE:     [ 45, 48, 52, 56, 60, 64 ]
      DIAMOND_ORE:     [ 50, 54, 58, 62, 66, 70 ]
      RUBY_ORE:        [ 60, 62, 65, 68, 70, 75 ]
      COBALT_ORE:      [ 65, 68, 72, 76, 80, 85 ]   # > rubis à chaque palier

  FARMER:
    display: "Agriculteur"
    color: "§a"
    description: "Cultive les terres et plante des graines pour progresser"
    actions:
      # "break" = casser le bloc, "place" = le poser
      break:
        #               I   II  III IV  V   VI
        "CROPS:7":     [ 8,  9,  10, 11, 12, 13 ]   # blé mûr (data value 7)
        SUGAR_CANE:    [ 5,  6,  7,  8,  9,  10 ]
        CACTUS:        [ 5,  6,  7,  8,  9,  10 ]
        "CARROT:7":    [ 10, 11, 12, 13, 14, 15 ]   # carottes mûres
        "POTATO:7":    [ 10, 11, 12, 13, 14, 15 ]   # pommes de terre mûres
      place:
        #               I   II  III IV  V   VI
        SEEDS:         [ 2,  2,  3,  3,  4,  4 ]
        SUGAR_CANE:    [ 1,  1,  2,  2,  3,  3 ]
        CACTUS:        [ 1,  1,  2,  2,  3,  3 ]
        CARROT_ITEM:   [ 2,  2,  3,  3,  4,  4 ]
        POTATO_ITEM:   [ 2,  2,  3,  3,  4,  4 ]

  ARTISAN:
    display: "Artisan"
    color: "§6"
    description: "Fabrique des items, brasse des potions et enchante"
    actions:
      #          I   II  III IV  V   VI
      craft:   [ 3,  4,  5,  6,  7,  8  ]   # XP par item crafté (hors blacklist)
      brew:    [ 20, 22, 25, 28, 31, 34 ]   # XP par potion brassée
      enchant: [ 25, 28, 31, 34, 37, 40 ]   # XP par enchantement
      anvil:   [ 15, 17, 19, 21, 23, 25 ]   # XP par utilisation de l'enclume
    # Crafts trop simples : aucune XP accordée pour ces résultats
    craft-blacklist:
      - WORKBENCH         # Table de craft
      - FURNACE           # Four
      - CHEST             # Coffre
      - TRAPPED_CHEST     # Coffre piégé
      - STICK             # Bâton
      - TORCH             # Torche
      - LADDER            # Échelle
      - WOOD              # Planches (toutes essences via metadata)
      - WOOD_STAIRS       # Escaliers bois (chêne)
      - SPRUCE_WOOD_STAIRS
      - BIRCH_WOOD_STAIRS
      - JUNGLE_WOOD_STAIRS
      - ACACIA_STAIRS
      - DARK_OAK_STAIRS
      - WOOD_STEP         # Dalles bois
      - FENCE             # Barrière bois (chêne)
      - SPRUCE_FENCE
      - BIRCH_FENCE
      - JUNGLE_FENCE
      - ACACIA_FENCE
      - DARK_OAK_FENCE
      - FENCE_GATE
      - SPRUCE_FENCE_GATE
      - BIRCH_FENCE_GATE
      - JUNGLE_FENCE_GATE
      - ACACIA_FENCE_GATE
      - DARK_OAK_FENCE_GATE
      - WOOD_DOOR         # Portes bois
      - SPRUCE_DOOR_ITEM
      - BIRCH_DOOR_ITEM
      - JUNGLE_DOOR_ITEM
      - ACACIA_DOOR_ITEM
      - DARK_OAK_DOOR_ITEM
      - SIGN              # Panneau
      - BED               # Lit
      - BOAT              # Bateau
      - WOOD_PLATE        # Plaque de pression bois
      - WOOD_BUTTON       # Bouton bois
      - BOWL              # Bol
      - WOOD_SWORD        # Outils en bois
      - WOOD_SPADE
      - WOOD_PICKAXE
      - WOOD_AXE
      - WOOD_HOE
      - STONE_SWORD       # Outils en pierre
      - STONE_SPADE
      - STONE_PICKAXE
      - STONE_AXE
      - STONE_HOE
      - COBBLESTONE_STAIRS
      - STEP              # Dalles pierre/cobble/brique
      - COBBLESTONE_WALL
      - STONE_BUTTON
      - STONE_PLATE

# ── Libellés lisibles (onglet Information) ─────────────────────────────────────
# Clé = identifiant d'action ci-dessus ; valeur = texte affiché. Optionnel : si
# absent, un libellé est généré automatiquement à partir de la clé.
source-names:
  # MINER
  COAL_ORE:     "Minerai de charbon"
  IRON_ORE:     "Minerai de fer"
  LAPIS_ORE:    "Minerai de lapis-lazuli"
  REDSTONE_ORE: "Minerai de redstone"
  QUARTZ_ORE:   "Minerai de quartz"
  GOLD_ORE:     "Minerai d'or"
  EMERALD_ORE:  "Minerai d'émeraude"
  DIAMOND_ORE:  "Minerai de diamant"
  RUBY_ORE:     "Minerai de rubis"
  COBALT_ORE:   "Minerai de cobalt"
  # FARMER (le préfixe Récolte/Plantation est ajouté automatiquement)
  "CROPS:7":    "Blé mûr"
  "CARROT:7":   "Carottes mûres"
  "POTATO:7":   "Pommes de terre mûres"
  SUGAR_CANE:   "Canne à sucre"
  CACTUS:       "Cactus"
  SEEDS:        "Graines"
  CARROT_ITEM:  "Carottes"
  POTATO_ITEM:  "Pommes de terre"
  # ARTISAN
  CRAFT:        "Fabriquer un item"
  BREW:         "Brasser une potion"
  ENCHANT:      "Enchanter un item"
  ANVIL:        "Réparer à l'enclume"

