name: OriginsFightCore
version: '1.0.0'
main: fr.originsfight.OriginsFightCore
prefix: OriginsFightCore
authors: [leziink]
description: Plugin RedConflict - gestion du serveur
# Dépendances optionnelles : présentes sur le Faction, absentes sur le Minage.
# softdepend = ordre de chargement respecté SI présent, mais pas obligatoire.
softdepend: [RedFaction, WorldGuard, Vault, PlaceholderAPI, LuckPerms]
commands:
  rtp:
    description: Téléportation aléatoire
  ct:
    description: Vérifie ton statut de combat
  repairall:
    description: Répare tous tes items (cooldown 24h)
    aliases: [repair]
    permission: redconflict.repair
  poubelle:
    description: Ouvre la poubelle virtuelle
    aliases: [trash]
  furnace:
    description: Cuit des items sans four
    usage: /furnace <this|all>
    permission: redconflict.furnace
  hdv:
    description: Hôtel des Ventes
    usage: /hdv [info|collect|history|list|clear|reload]
    aliases: [ah]
  shop:
    description: Boutique du serveur (prix dynamiques)
    usage: /shop [open]
    aliases: [magasin]
  pb:
    description: Consulter ou administrer les Points Boutique
    usage: /pb [joueur] | /pb add|remove|set <joueur> <montant>
    aliases: [points]
  pbshop:
    description: Ouvre la boutique PB (grades, commandes, spawners, offres spéciales)
    usage: /pbshop [offre <id> enable|disable|reroll] | /pbshop reload
    aliases: [boutique, pbboutique]
  metier:
    description: Système de métiers (Mineur/Agriculteur/Artisan)
    usage: /metier [top [metier]|info|set|xp|reset]
    aliases: [job, jobs, profession]
  sellall:
    description: Vend automatiquement tous les items vendables de l'inventaire au prix du shop
    usage: /sellall
  shopdebug:
    description: Commandes de debug du shop (admin)
    usage: /shopdebug <tick all|info|reset>
    permission: shop.admin
  shopevent:
    description: Gestion des événements boursiers (krach, inflation, aubaine) — staff
    usage: /shopevent <list|reload|krach|inflation|aubaine|stop> [...]
    permission: shop.admin
  bottlexp:
    description: Embouteille tes niveaux d'XP (min 10)
    aliases: [bxp, bottle]
  trade:
    description: Échange sécurisé d'items avec un joueur
    usage: /trade <joueur> | /trade accept | /trade deny
    aliases: [echanger]
  baltop:
    description: Classement des joueurs les plus riches (GUI avec têtes)
    usage: /baltop [page]
    aliases: [moneytop, balancetop]
  ks:
    description: Affiche vos statistiques de combat (kills, deaths, ratio, temps de jeu)
    usage: /ks [joueur]
    aliases: [killscore]
  profil:
    description: Ouvre la fiche de réputation graphique d'un joueur — kills, K/D, faction, prime, killstreak, monnaie
    usage: /profil [joueur]
    aliases: [stats, ep, fiche]
  giveall:
    description: Distribue des items à tous les joueurs (staff)
    usage: /giveall
    permission: staff.giveall
  vision:
    description: Toggle la vision nocturne
    usage: /vision
    permission: redconflict.nv
    aliases: [nv, nightvision]
  prime:
    description: Système de primes PvP (bounty)
    usage: /prime <joueur> <montant> | /prime list | /prime info [joueur] | /prime cancel
    aliases: [bounty]
  friend:
    description: Système d'amis (pas de dégâts entre amis, max 5)
    usage: /friend <add|accept|deny|remove|list|requests> [joueur]
    aliases: [ami, amis, friends]
  loto:
    description: Participer au loto, voir son état ou le prochain tirage
    usage: /loto <montant> | /loto info | /loto next | /loto help
    aliases: [lottery]
  guide:
    description: Affiche le guide du serveur RedConflict
    usage: /guide
    aliases: [aide]
  commands:
    description: Affiche la liste des commandes disponibles
    usage: /commands
    aliases: [cmds]
  hub:
    description: Se téléporter au serveur HUB
    usage: /hub
    # 'spawn' n'est plus un alias : c'est la commande essentials /spawn.
    aliases: [lobby]
  minage:
    description: Se téléporter au serveur Minage
    usage: /minage
    aliases: [mine]
  faction:
    description: Se téléporter au serveur Faction
    usage: /faction
    aliases: [fac, factions]
  cobble:
    description: Toggle le filtrage automatique de la cobblestone
    usage: /cobble
  tpu:
    description: Toggle "TP Unavailable" — bloque les demandes de TP entrantes (sauf amis/faction)
    usage: /tpu
  msg:
    description: Envoie un message privé à un joueur
    usage: /msg <joueur> <message>
    aliases: [tell, w, whisper, pm, emsg, etell]
  r:
    description: Répond au dernier message privé reçu
    usage: /r <message>
    aliases: [reply]
  annonyme:
    description: Cacher le pseudo
    usage: /annonyme
    aliases: [a]
  msgspy:
    description: Toggle la surveillance des messages privés (staff)
    usage: /msgspy
    permission: staff.msgspy
  # ── Système Staff ─────────────────────────────────────────────────────────
  staffmode:
    description: Active/désactive le mode staff
    usage: /staffmode
    permission: staff.staffmode
    aliases: [sm]
  vanish:
    description: Active/désactive le vanish
    usage: /vanish
    permission: staff.vanish
    aliases: [v]
  freeze:
    description: Freeze ou dégèle un joueur
    usage: /freeze <joueur>
    permission: staff.freeze
  warn:
    description: Avertit un joueur
    usage: /warn <joueur> <raison>
    permission: staff.warn
  kick:
    description: Expulse un joueur
    usage: /kick <joueur> [raison]
    permission: staff.kick
  mute:
    description: Mute un joueur
    usage: /mute <joueur> <durée|perm> <raison>
    permission: staff.mute
  unmute:
    description: Démute un joueur
    usage: /unmute <joueur>
    permission: staff.unmute
  ban:
    description: Bannit un joueur (+ vérification IP)
    usage: /ban <joueur> <durée|perm> <raison>
    permission: staff.ban
  unban:
    description: Débannit un joueur
    usage: /unban <joueur>
    permission: staff.unban
  sanctions:
    description: Historique des sanctions d'un joueur
    usage: /sanctions <joueur> [page]
    permission: staff.sanctions
    aliases: [hist, historique]
  unsanction:
    description: Remet à zéro toutes les sanctions actives d'un joueur
    usage: /unsanction <joueur>
    permission: staff.unsanction
  sc:
    description: Toggle/envoie un message dans le chat staff
    usage: /sc [message]
    permission: staff.staffchat
    aliases: [staffchat]
  clearchat:
    description: Efface le chat pour tous
    usage: /clearchat
    permission: staff.clearchat
    aliases: [ccl]
  lockchat:
    description: Verrouille/déverrouille le chat public
    usage: /lockchat
    permission: staff.lockchat
  topluck:
    description: Classement de minage GUI (minerais moddés)
    usage: /topluck
    permission: staff.topluck
    aliases: [tl]
  lagswitch:
    description: Gestion du système anti lag-switch
    usage: /lagswitch <info|reset|status|reload|debug> [joueur]
    permission: redconflict.staff
    aliases: [ls, antilag]
  clearlagg:
    description: Gestion du système de nettoyage d'entités
    usage: /clearlagg <now|info|reload|count> [monde]
    permission: redconflict.staff
    aliases: [cl, lagg]
  dbbackup:
    description: Sauvegarde de la base de données — now (immédiate) / next (prochaine auto) (staff)
    usage: /dbbackup <now|next>
    permission: redconflict.staff
    aliases: [backupnow]
  annonce:
    description: Diffuse une annonce stylée sur tous les serveurs (staff)
    usage: /annonce <message>
    permission: redconflict.staff
    # Pas de 'broadcast'/'bc' : déjà pris par EssentialsX (conflit). 'ann' est sûr.
    aliases: [ann]
  # ── Module Essentials — administration ──────────────────────────────────
  red:
    description: Administration du Core (reload à chaud, état des modules, import EssentialsX)
    usage: /red <reload|modules|import>
    permission: redconflict.admin
  # ── Module Essentials — téléportation ───────────────────────────────────
  spawn:
    description: Se téléporter au spawn du serveur
    usage: /spawn
  setspawn:
    description: Définit le spawn du serveur (admin)
    usage: /setspawn
    permission: redconflict.setspawn
  tpa:
    description: Demande de téléportation vers un joueur
    usage: /tpa <joueur>
  tpaccept:
    description: Accepte la demande de téléportation en attente
    usage: /tpaccept
    aliases: [tpyes]
  tpno:
    description: Refuse la demande de téléportation en attente
    usage: /tpno
    aliases: [tpdeny]
  tpahere:
    description: Demande à un joueur de venir vers vous
    usage: /tpahere <joueur>
  tp:
    description: Téléportation directe (admin)
    usage: /tp <joueur> [joueur2]
    permission: redconflict.tp
  top:
    description: Se téléporter au sommet du bloc courant
    usage: /top
  back:
    description: Retour à la position précédente (téléportation ou mort)
    usage: /back
  home:
    description: Se téléporter à un home
    usage: /home [nom]
  sethome:
    description: Définit un home
    usage: /sethome [nom]
  delhome:
    description: Supprime un home
    usage: /delhome <nom>
  warp:
    description: Se téléporter à un warp
    usage: /warp <nom>
  setwarp:
    description: Définit un warp (admin)
    usage: /setwarp <nom>
    permission: redconflict.setwarp
  delwarp:
    description: Supprime un warp (admin)
    usage: /delwarp <nom>
    permission: redconflict.delwarp
  # ── Module Essentials — inventaire / items ──────────────────────────────
  give:
    description: Donne un item à un joueur (admin)
    usage: /give <joueur> <item> [quantité]
    permission: redconflict.give
  more:
    description: Complète le stack tenu en main
    usage: /more
    permission: redconflict.more
  clear:
    description: Vide l'inventaire
    usage: /clear [joueur]
    permission: redconflict.clear
    aliases: [ci, clearinventory]
  enchant:
    description: Enchante l'item tenu en main
    usage: /enchant <enchantement> [niveau]
    permission: redconflict.enchant
  anvil:
    description: Ouvre une enclume virtuelle
    usage: /anvil
    permission: redconflict.anvil
  craft:
    description: Ouvre une table de craft virtuelle
    usage: /craft
    permission: redconflict.craft
    aliases: [wb, workbench]
  ec:
    description: Ouvre son enderchest
    usage: /ec [joueur]
    permission: redconflict.ec
    aliases: [enderchest, echest]
  hat:
    description: Place l'item tenu en main sur la tête
    usage: /hat
    permission: redconflict.hat
  invsee:
    description: Consulte l'inventaire d'un joueur (staff, lecture seule)
    usage: /invsee <joueur>
    permission: redconflict.invsee
  # ── Module Essentials — joueur / statut ─────────────────────────────────
  feed:
    description: Recharge la faim
    usage: /feed [joueur]
    permission: redconflict.feed
  heal:
    description: Soigne (vie, faim, feu, effets négatifs)
    usage: /heal [joueur]
    permission: redconflict.heal
  kill:
    description: Tue un joueur (admin)
    usage: /kill [joueur]
    permission: redconflict.kill
  god:
    description: Mode invincible (toggle)
    usage: /god [joueur]
    permission: redconflict.god
  fly:
    description: Mode vol (toggle)
    usage: /fly [joueur]
    permission: redconflict.fly
  speed:
    description: Vitesse de déplacement (marche ou vol)
    usage: /speed <1-10|reset> [joueur]
    permission: redconflict.speed
  gm:
    description: Change de mode de jeu
    usage: /gm <0|1|2|3> [joueur]
    permission: redconflict.gm
    aliases: [gamemode]
  xp:
    description: Gère l'expérience (points, ou niveaux avec le suffixe l)
    usage: /xp <give|set> <joueur> <montant>[l]
    permission: redconflict.xp
    aliases: [exp]
  potion:
    description: S'applique un effet de potion
    usage: /potion <type> <durée> <niveau> | /potion clear
    permission: redconflict.potion
  # ── Module Essentials — économie ────────────────────────────────────────
  pay:
    description: Paie un joueur (hors ligne accepté)
    usage: /pay <joueur> <montant>
  money:
    description: Consulte son solde
    usage: /money [joueur]
    aliases: [bal, balance]
  eco:
    description: Administration de l'économie (admin)
    usage: /eco <give|take|set> <joueur> <montant>
    permission: redconflict.eco
    aliases: [economy]
  # ── Module Essentials — social / utilitaire ─────────────────────────────
  ignore:
    description: Masque les messages d'un joueur (toggle)
    usage: /ignore <joueur>
  near:
    description: Joueurs proches, triés par distance
    usage: /near [rayon]
  seen:
    description: Dernière connexion d'un joueur
    usage: /seen <joueur>
  list:
    description: Joueurs connectés
    usage: /list
    aliases: [online]
  help:
    description: Aide générale (commandes disponibles)
    usage: /help [page]
  # ── Module Essentials — monde ───────────────────────────────────────────
  weather:
    description: Change la météo du monde courant (admin)
    usage: /weather <sun|rain|storm>
    permission: redconflict.weather
    aliases: [meteo]