name: OriginsFightCore
version: '${project.version}'
main: fr.originsfight.OriginsFightCore
prefix: OriginsFightCore
authors: [leziink]
description: Plugin RedConflict - gestion du serveur
# Dépendances optionnelles : présentes sur le Faction, absentes sur le Minage.
# softdepend = ordre de chargement respecté SI présent, mais pas obligatoire.
softdepend: [Factions, WorldGuard, Vault, PlaceholderAPI, LuckPerms]
commands:
  rtp:
    description: Téléportation aléatoire
  ct:
    description: Vérifie ton statut de combat
  repairall:
    description: Répare tous tes items (cooldown 24h)
    aliases: [repair]
    permission: redconflict.repair
  poubelle:
    description: Ouvre la poubelle virtuelle
    aliases: [trash]
  furnace:
    description: Cuit des items sans four
    usage: /furnace <this|all>
    permission: redconflict.furnace
  hdv:
    description: Hôtel des Ventes
    usage: /hdv [info|collect|history|list|clear|reload]
    aliases: [ah]
  shop:
    description: Boutique du serveur (prix dynamiques)
    usage: /shop [open]
    aliases: [magasin]
  pb:
    description: Consulter ou administrer les Points Boutique
    usage: /pb [joueur] | /pb add|remove|set <joueur> <montant>
    aliases: [points]
  pbshop:
    description: Ouvre la boutique PB (grades, commandes, spawners, offres spéciales)
    usage: /pbshop [offre <id> enable|disable|reroll] | /pbshop reload
    aliases: [boutique, pbboutique]
  metier:
    description: Système de métiers (Mineur/Agriculteur/Artisan)
    usage: /metier [top [metier]|info|set|xp|reset]
    aliases: [job, jobs, profession]
  sellall:
    description: Vend automatiquement tous les items vendables de l'inventaire au prix du shop
    usage: /sellall
  shopdebug:
    description: Commandes de debug du shop (admin)
    usage: /shopdebug <tick all|info|reset>
    permission: shop.admin
  shopevent:
    description: Gestion des événements boursiers (krach, inflation, aubaine) — staff
    usage: /shopevent <list|reload|krach|inflation|aubaine|stop> [...]
    permission: shop.admin
  bottlexp:
    description: Embouteille tes niveaux d'XP (min 10)
    aliases: [bxp, bottle]
  trade:
    description: Échange sécurisé d'items avec un joueur
    usage: /trade <joueur> | /trade accept | /trade deny
    aliases: [echanger]
  baltop:
    description: Classement des joueurs les plus riches (GUI avec têtes)
    usage: /baltop [page]
    aliases: [moneytop, balancetop]
  ks:
    description: Affiche vos statistiques de combat (kills, deaths, ratio, temps de jeu)
    usage: /ks [joueur]
    aliases: [killscore]
  profil:
    description: Ouvre la fiche de réputation graphique d'un joueur — kills, K/D, faction, prime, killstreak, monnaie
    usage: /profil [joueur]
    aliases: [stats, ep, fiche]
  giveall:
    description: Distribue des items à tous les joueurs (staff)
    usage: /giveall
    permission: staff.giveall
  vision:
    description: Toggle la vision nocturne
    usage: /vision
    permission: redconflict.nv
    aliases: [nv, nightvision]
  prime:
    description: Système de primes PvP (bounty)
    usage: /prime <joueur> <montant> | /prime list | /prime info [joueur] | /prime cancel
    aliases: [bounty]
  friend:
    description: Système d'amis (pas de dégâts entre amis, max 5)
    usage: /friend <add|accept|deny|remove|list|requests> [joueur]
    aliases: [ami, amis, friends]
  loto:
    description: Participer au loto, voir son état ou le prochain tirage
    usage: /loto <montant> | /loto info | /loto next | /loto help
    aliases: [lottery]
  guide:
    description: Affiche le guide du serveur RedConflict
    usage: /guide
    aliases: [aide]
  commands:
    description: Affiche la liste des commandes disponibles
    usage: /commands
    aliases: [cmds]
  hub:
    description: Se téléporter au serveur HUB
    usage: /hub
    aliases: [lobby, spawn]
  minage:
    description: Se téléporter au serveur Minage
    usage: /minage
    aliases: [mine]
  faction:
    description: Se téléporter au serveur Faction
    usage: /faction
    aliases: [fac, factions]
  cobble:
    description: Toggle le filtrage automatique de la cobblestone
    usage: /cobble
  msg:
    description: Envoie un message privé à un joueur
    usage: /msg <joueur> <message>
    aliases: [tell, w, whisper, pm, emsg, etell]
  r:
    description: Répond au dernier message privé reçu
    usage: /r <message>
    aliases: [reply]
  annonyme:
    description: Cacher le pseudo
    usage: /annonyme
    aliases: [a]
  msgspy:
    description: Toggle la surveillance des messages privés (staff)
    usage: /msgspy
    permission: staff.msgspy
  # ── Système Staff ─────────────────────────────────────────────────────────
  staffmode:
    description: Active/désactive le mode staff
    usage: /staffmode
    permission: staff.staffmode
    aliases: [sm]
  vanish:
    description: Active/désactive le vanish
    usage: /vanish
    permission: staff.vanish
    aliases: [v]
  freeze:
    description: Freeze ou dégèle un joueur
    usage: /freeze <joueur>
    permission: staff.freeze
  warn:
    description: Avertit un joueur
    usage: /warn <joueur> <raison>
    permission: staff.warn
  kick:
    description: Expulse un joueur
    usage: /kick <joueur> [raison]
    permission: staff.kick
  mute:
    description: Mute un joueur
    usage: /mute <joueur> <durée|perm> <raison>
    permission: staff.mute
  unmute:
    description: Démute un joueur
    usage: /unmute <joueur>
    permission: staff.unmute
  ban:
    description: Bannit un joueur (+ vérification IP)
    usage: /ban <joueur> <durée|perm> <raison>
    permission: staff.ban
  unban:
    description: Débannit un joueur
    usage: /unban <joueur>
    permission: staff.unban
  sanctions:
    description: Historique des sanctions d'un joueur
    usage: /sanctions <joueur> [page]
    permission: staff.sanctions
    aliases: [hist, historique]
  unsanction:
    description: Remet à zéro toutes les sanctions actives d'un joueur
    usage: /unsanction <joueur>
    permission: staff.unsanction
  sc:
    description: Toggle/envoie un message dans le chat staff
    usage: /sc [message]
    permission: staff.staffchat
    aliases: [staffchat]
  clearchat:
    description: Efface le chat pour tous
    usage: /clearchat
    permission: staff.clearchat
    aliases: [ccl]
  lockchat:
    description: Verrouille/déverrouille le chat public
    usage: /lockchat
    permission: staff.lockchat
  topluck:
    description: Classement de minage GUI (minerais moddés)
    usage: /topluck
    permission: staff.topluck
    aliases: [tl]
  lagswitch:
    description: Gestion du système anti lag-switch
    usage: /lagswitch <info|reset|status|reload|debug> [joueur]
    permission: redconflict.staff
    aliases: [ls, antilag]
  clearlagg:
    description: Gestion du système de nettoyage d'entités
    usage: /clearlagg <now|info|reload|count> [monde]
    permission: redconflict.staff
    aliases: [cl, lagg]