rtp:
  max: 9000
  min: 1000
  # Préavis avant la téléportation, en secondes. Le joueur doit rester sur son
  # bloc : tourner la vue (souris) n'annule plus rien, seul un déplacement
  # annule — la même règle que /spawn. Les OP n'ont pas de préavis.
  warmup-seconds: 3
  # Nombre de colonnes tirées au sort avant d'abandonner. Une colonne est
  # rejetée si elle tombe en mer, dans la lave ou sur la cime d'un arbre.
  max-attempts: 12
  # Budget total de la préparation, en secondes. Le terrain d'arrivée est généré
  # et chargé PENDANT le préavis, un chunk par tick (le chunk d'arrivée et ses
  # huit voisins). Sur un monde neuf cela peut dépasser le préavis, et c'est
  # voulu : mieux vaut faire patienter que déposer le joueur dans un chunk que
  # son client n'a pas encore reçu — c'est ce qui le faisait apparaître
  # « dans le sol ».
  max-prepare-seconds: 20

# ── Système Anti Lag-Switch ───────────────────────────────────────────────────
lagswitch:

  # ── Seuils de détection ──────────────────────────────────────────────────
  # Ping absolu (ms) à dépasser pour commencer à suspecter un joueur.
  # Relevez cette valeur si vous avez des joueurs avec un ping naturellement élevé.
  ping-threshold-ms: 1200

  # Variation brutale minimale du ping en un seul check (ms).
  # Un saut < à cette valeur = lag naturel progressif → pas déclenché.
  # Un saut >= = déconnexion brusque (lag-switch) → déclenché rapidement.
  ping-delta-threshold-ms: 600

  # Nombre de checks consécutifs au-dessus du seuil + delta brutal avant déclenchement
  # (chemin "rapide" : ping absolu élevé ET variation brusque)
  ticks-before-trigger: 3

  # Nombre de checks consécutifs uniquement au-dessus du seuil absolu avant déclenchement
  # (chemin "lent" : connexion coupée durablement sans spike détecté)
  # Avec check-interval-ticks=10, 8 checks ≈ 4 secondes de déconnexion
  ticks-before-trigger-hard: 8

  # ── Timing ──────────────────────────────────────────────────────────────
  # Intervalle entre deux vérifications (ticks, 20 ticks = 1 seconde)
  # 10 = vérification toutes les 0.5s — bon compromis performance/réactivité
  check-interval-ticks: 10

  # Durée de la grace-period après retour de la connexion (ms)
  # Les actions restent bloquées pendant ce délai
  grace-period-ms: 3000

  # ── Sanctions automatiques (désactivées par défaut) ──────────────────────
  # Recommandé : laisser à 0 et gérer manuellement via /lagswitch unfreeze/freeze
  # Nombre d'incidents avant kick automatique (0 = désactivé)
  incidents-before-kick: 0
  # Nombre d'incidents avant ban temporaire (0 = désactivé)
  incidents-before-ban: 0
  # Durée du ban temporaire automatique (secondes, si incidents-before-ban > 0)
  ban-duration-seconds: 300

  # ── Comportement ────────────────────────────────────────────────────────
  # Rubber-band : téléporte le joueur à sa position de freeze pendant le lag
  rubber-band: true
  # Logs de debug détaillés en console (ping + delta de chaque joueur à chaque check)
  # À activer uniquement pour diagnostiquer des faux positifs
  debug: false

# ── Système ClearLagg ────────────────────────────────────────────────────────
clearlagg:

  # Intervalle entre deux nettoyages automatiques (en minutes)
  interval-minutes: 15

  # Secondes avant le clearlagg où un avertissement est diffusé en chat
  # Mettre à 0 pour désactiver l'avertissement
  # NOTE: Vous pouvez désormais définir plusieurs avertissements avec la clé
  # "warning-seconds-list":
  #   - 60
  #   - 30
  # Si cette liste est absente, la clé legacy "warning-seconds" est utilisée.
  warning-seconds: 30
  warning-seconds-list:
    - 60
    - 30

  # Send a title (big overlay) in addition to chat warnings
  warning-use-title: true
  title-fade-in: 5
  title-stay: 40
  title-fade-out: 5

  # ── Entités non-vivantes ──────────────────────────────────────────────────
  # Supprimer les items droppés au sol
  clear-items: true
  # Supprimer les flèches tirées
  clear-arrows: true
  # Supprimer les orbes d'expérience
  clear-exp-orbs: true

  # ── Mobs ─────────────────────────────────────────────────────────────────
  # Si true, TOUS les mobs sont supprimés (sauf exclus ci-dessous, nommés et apprivoisés)
  # Si false, seuls les mobs listés dans mobs-to-clear sont supprimés
  clear-all-mobs: false

  # Liste des types de mobs à supprimer (ignoré si clear-all-mobs: true)
  # Noms exacts des EntityType Bukkit (en majuscule ou minuscule)
  # Voir la liste complète : https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/EntityType.html
  mobs-to-clear:
    - ZOMBIE
    - SKELETON
    - CREEPER
    - SPIDER
    - CAVE_SPIDER
    - ENDERMAN
    - WITCH
    - SLIME
    - MAGMA_CUBE
    - BLAZE
    - GHAST
    - ZOMBIE_PIGMAN
    - SILVERFISH
    - ENDERMITE
    - GUARDIAN
    # Mobs passifs (décommenter/ajouter si vous voulez les nettoyer)
    - COW
    - PIG
    - SHEEP
    - CHICKEN
    - RABBIT
    - HORSE
    - MULE
    - DONKEY
    - WOLF

  # Types de mobs TOUJOURS exclus du clearlagg (même si clear-all-mobs: true)
  # Par défaut : villageois et zombie-villageois protégés
  excluded-mobs:
    - VILLAGER
    - ZOMBIE_VILLAGER

  # ── Protection ────────────────────────────────────────────────────────────
  # Protéger les entités qui ont un nametag personnalisé (nom visible au-dessus)
  protect-named: true
  # Protéger les animaux apprivoisés (chiens, chats...)
  protect-tamed: true

  # ── MobStacker detection (heuristiques) ──────────────────────────────────
  # Active la détection des mobs "stackés" (MobStacker, etc.)
  detect-mobstacker: true
  # Clés metadata courantes utilisées par des plugins de stacking (heuristique)
  mobstacker-metadata-keys:
    - stack
    - stacked
    - mobstack
    - mobstacker
    - stackamount
    - stack_size
  # Si true, autorise la suppression des entités nommées détectées comme "stackées"
  force-clear-named-stacked: true

  # ── Mondes exclus ─────────────────────────────────────────────────────────
  # Mondes où le clearlagg ne s'applique PAS (laisser vide pour tout nettoyer)
  excluded-worlds: []
  # Exemple :
  # excluded-worlds:
  #   - creative_world
  #   - spawn

  # ── Debug ─────────────────────────────────────────────────────────────────
  debug: false

# ── Système de primes (Bounty) & Killstreak ──────────────────────────────────
bounty:

  # Paliers de killstreak qui déclenchent une prime automatique.
  # Quand un joueur atteint exactement N kills d'affilée, une prime est posée.
  # Si un nouveau palier est franchi sans mourir, la prime est multipliée
  # par escalation-multiplier au lieu d'en créer une nouvelle.
  thresholds:
    - killstreak: 5
      amount: 100
    - killstreak: 10
      amount: 200
    - killstreak: 20
      amount: 400

  # Multiplicateur appliqué à la prime existante quand un nouveau palier est franchi.
  escalation-multiplier: 1.5

  # Réinitialiser le killstreak quand un joueur se déconnecte.
  reset-on-disconnect: true

  # Anti-bypass faction : si un joueur a quitté la faction de sa victime
  # dans les N jours, son kill n'est pas comptabilisé.
  # Mettre à 0 pour désactiver cette protection.
  faction-leave-days: 7

commands:
  # Commandes TOUJOURS désactivées pour les non-op (sans le "/" devant)
  always-disabled:
    - pl
    - plugins
    - version
    - ver
    - bukkit:pl
    - bukkit:plugins
  # Commandes désactivées UNIQUEMENT pendant un combat (sans le "/" devant)
  disabled-in-combat:
    - rtp
    - ec
    - enderchest
    - poubelle
    - shop
    - hdv
    - ah
    - lmsr
    - pbshop
    - boutique
    - minage
    - faction
    - hub

# ── Monnaie ───────────────────────────────────────────────────────────────────
monnaie:
  symbole: "€"

# ── Système Points Boutique (PB) ──────────────────────────────────────────────
# Échelle officielle : 1€ = 10 PB.
pb:
  # Seuil au-dessus duquel toute opération PB (add/remove/set) est diffusée
  # aux membres du staff connectés (permission : staff.pb-alerts ou staff.staff).
  alert-threshold: 500

  # Où vit le solde en Points Boutique.
  #
  #   site  (défaut) → table `rc_pb` de la base d'Azuriom. UN SEUL exemplaire,
  #                    partagé avec la boutique web : le joueur dépense les mêmes
  #                    PB en jeu et sur le site, et ne peut pas les dépenser deux
  #                    fois (verrou de ligne au débit). Exige site.enabled: true.
  #   h2             → `player_profiles.pb`, comportement d'avant la boutique
  #                    web. Dans ce mode la boutique du site ne peut pas débiter :
  #                    elle n'a aucun accès à H2. Repli en cas de problème.
  #
  # ⚠️ Tous les serveurs de la grappe doivent avoir la MÊME valeur. Deux serveurs
  # qui ne s'accordent pas sur l'emplacement du solde, ce sont deux soldes.
  ledger: site

# ── Activation / désactivation des fonctionnalités par serveur ────────────────
# Permet de couper une fonctionnalité (et sa commande) sur CE serveur sans toucher
# au code. Mettre une clé à "false" désactive la commande correspondante : elle
# répond alors « fonctionnalité désactivée sur ce serveur ».
# La clé porte le même nom que la commande. Toute clé absente = activée (true).
#
# Exemple typique : sur le Minage, pas de loto ni de /loto -> "loto: false".
#
# Cas particulier : "loto" coupe AUSSI le tirage automatique (manager complet),
# pas seulement la commande. Les autres clés ne coupent que la commande ; le
# module sous-jacent peut continuer à tourner (à durcir au cas par cas si besoin).
features:
  loto: true
  prime: true
  trade: true
  hdv: true
  shop: true
  sellall: true
  metier: true
  bottlexp: true
  furnace: true
  repairall: true
  vision: true
  rtp: true
  baltop: true
  guide: true
  poubelle: true

# ── Intégrations avec les plugins externes ───────────────────────────────────
hooks:
  # Intégration RedFaction : tag/relation de faction dans le HUD et /profil,
  # zone de claim, marqueurs faction/alliés de la minimap, ping faction/allié,
  # exclusion des alliés dans /prime et /tpu, anti-bypass des primes.
  #
  # Mettre à false sur un serveur SANS factions (ex. le Minage) : le plugin
  # n'appelle alors jamais l'API RedFaction, même si le plugin est installé.
  # Les fonctionnalités concernées retombent proprement sur "sans faction"
  # (les amis restent visibles sur la minimap, les pings amis fonctionnent).
  #
  # true = intégration active SI le plugin RedFaction est présent (détection
  # automatique : absent = intégration coupée, aucune erreur).
  # Modification prise en compte au redémarrage du serveur (pas à /red reload).
  redfaction: true

# ── Base de données centralisée H2 ───────────────────────────────────────────
# MODES disponibles :
#
# 1) Mode EMBARQUÉ (serveur standalone) :
#    server.enabled: false  +  host: localhost
#    → La base est un simple fichier local (plugins/RedConflictCore/data/central.mv.db).
#      Aucun port réseau requis. Correct si vous n'avez qu'UN seul serveur Minecraft.
#
# 2) Mode SERVEUR TCP (multi-serveur, un seul serveur héberge H2) :
#    server.enabled: true sur LE serveur qui héberge la base : c'est le FACTION
#    (le HUB est un lobby verrouillé SANS RedConflictCore, il n'héberge pas H2).
#    server.enabled: false + host: <adresse du Faction> sur les AUTRES (le Minage).
#
# 3) Mode CLIENT TCP pur :
#    server.enabled: false + host: <ip_ou_hostname_distant>
#
# ⚠️ LE PIÈGE, ET IL A DÉJÀ COÛTÉ UN INCIDENT :
#    "server.enabled: false + host: localhost" n'est PAS un client qui se
#    rabat sur la machine locale — c'est le mode 1, une base FICHIER ISOLÉE.
#    Un serveur de la grappe configuré ainsi ne partage RIEN : inventaire,
#    enderchest, homes, HDV, métiers, sanctions, tout est en double et diverge
#    en silence. Depuis le lot RTP/verrous, le plugin l'affiche en WARNING au
#    démarrage quand database.sync.enabled est vrai : lisez la console.
#
# ⚠️ QUELLE ADRESSE METTRE SUR LE CLIENT (Minage) ?
#    SOUS PTERODACTYL : 172.18.0.1, le pont Docker — la même adresse que
#    site.url plus bas. PAS 127.0.0.1 : dans un conteneur, 127.0.0.1 désigne le
#    conteneur LUI-MÊME, donc le Minage se chercherait tout seul. Il faut en
#    plus déclarer une allocation 172.18.0.1:9092 sur le serveur FACTION dans
#    le panel, sinon le port du conteneur n'est pas publié sur l'hôte et la
#    connexion est refusée.
#    HORS CONTENEURS (les deux serveurs sur la même machine) : 127.0.0.1.
database:
  server:
    # true = ce serveur héberge H2 et démarre le serveur TCP (un seul par grappe).
    # false + host=localhost = mode embarqué (fichier local isolé, aucun TCP).
    # false + host distant   = client TCP pur.
    enabled: false
  # Hôte/port du serveur H2 TCP. Sur un serveur CLIENT (ex. Minage), voir
  # l'encadré « quelle adresse » ci-dessus — et JAMAIS localhost.
  host: localhost
  port: 9092
  # Nom de la base → jdbc:h2:tcp://<host>:<port>/./data/<name>;MODE=PostgreSQL
  name: central
  user: sa
  password: ""
  pool:
    minimum-idle: 2
    maximum-size: 10
  # Identifiant UNIQUE de CE serveur dans la grappe (faction | minage | hub …).
  # Utilisé par le verrou de présence cross-serveur.
  server-id: faction
  lock:
    # Temps accordé au serveur précédent, en millisecondes, pour sauvegarder et
    # relâcher le verrou avant que le joueur n'apparaisse ici.
    #
    # Velocity ouvre la connexion au serveur d'arrivée AVANT de fermer celle du
    # serveur de départ : sans cette attente, l'arrivée charge l'inventaire
    # d'avant le transfert et les deux serveurs se mettent à diverger. L'attente
    # a lieu pendant le pré-login, hors du thread principal (le joueur patiente
    # sur « Connexion… », le serveur ne rame pas) et s'arrête dès que l'autre a
    # fini — en pratique quelques dizaines de millisecondes.
    wait-ms: 4000
    # Si true, un joueur encore verrouillé APRÈS cette attente est kické (le
    # temps que ses données soient sauvegardées ailleurs). false = il entre
    # quand même, avec un avertissement en console.
    kick-on-conflict: false
  sync:
    # Synchronisation cross-serveur de l'inventaire complet + enderchest.
    # Au join : chargement depuis H2 (H2 fait autorité). Au quit : sauvegarde dans H2.
    # Premier passage d'un joueur : son inventaire local est conservé et enregistré comme base.
    enabled: true
    # Sécurité anti-crash : sauvegarde auto de l'inventaire des joueurs connectés (en minutes).
    # En cas de crash serveur, borne la perte au pire à cet intervalle. 0 = désactivé.
    # Snapshot sur le thread principal + écriture base asynchrone → aucun lag pour les joueurs.
    autosave-minutes: 3

# ── Pont vers le site (Azuriom) ───────────────────────────────────────────────
# Une seule connexion partagée, qui sert à quatre choses :
#
#   1. le SOLDE PB (`rc_pb`) — déménagé ici, plus répliqué : c'est le même
#      exemplaire que débite la boutique du site (voir pb.ledger plus haut) ;
#   2. le CATALOGUE (`rc_shop_items`) — boutique/boutique.yml publié tel quel,
#      pour que le site affiche exactement la même grille tarifaire ;
#   3. les DROITS POSSÉDÉS (`rc_entitlements`) — ce qui permet de refuser un
#      grade ou une commande que le joueur a déjà, des deux côtés ;
#   4. le MIROIR des profils (`rc_players`, `rc_factions`) — classements du site.
#
# Le point 4 reste à sens unique : H2 est propriétaire des stats et des
# inventaires, le site n'en reçoit qu'un instantané. Seuls les PB font
# exception, et c'est délibéré : un solde dépensable des deux côtés ne peut pas
# être répliqué sans finir par diverger.
#
# ⚠️ À activer sur UN SEUL serveur de la grappe : celui qui héberge H2, donc le
# Faction. Faction et Minage lisent la même base ; les deux écriraient les mêmes
# lignes en concurrence, pour rien.
#
# ⚠️ Le compte SQL ne doit avoir de droits QUE sur les tables rc_*. La base du
# site contient aussi `users`, donc les hachages de mots de passe et les jetons
# de session : un plugin de gameplay n'a rien à y faire. Les GRANT exacts sont
# dans RedConflictSite/sql/001-site-bridge.sql.
#
# 172.18.0.1 = pont Docker. Sous Pterodactyl, 127.0.0.1 désigne le conteneur
# lui-même et non la machine hôte : MariaDB y serait injoignable.
site:
  enabled: false
  url: "jdbc:mariadb://172.18.0.1:3306/azuriom"
  user: "rc_sync"
  password: ""
  # Le ledger PB est sur le chemin critique d'un achat : quelques connexions de
  # marge, contrairement aux deux que suffisaient au seul miroir.
  pool-size: 6
  # Relecture du solde PB des joueurs connectés, en secondes. Sert à afficher
  # tout de suite un achat ou un paiement fait sur le site. Une seule requête
  # pour tout le monde, et aucun paquet envoyé si rien n'a bougé.
  refresh-seconds: 20

  # Reprise des commandes web qu'AzLink n'a pas livrées. La livraison normale
  # passe par lui ; si le DÉPÔT de la commande échoue — aucun serveur déclaré
  # dans l'administration, par exemple — rien ne réessaie et le joueur reste
  # débité sans rien recevoir. Cette passe regarde rc_orders directement.
  # Ne s'active que sur le serveur qui porte aussi le miroir.
  retry-orders: true
  # Âge à partir duquel une commande est reprise. Assez long pour laisser AzLink
  # faire son travail (il relève toutes les minutes), assez court pour que le
  # joueur ne s'impatiente pas.
  retry-after-minutes: 3

  # Miroir des profils vers rc_players / rc_factions.
  mirror-enabled: true
  # Un instantané toutes les N minutes. Inutile de descendre bas : le site
  # affiche des classements, pas du temps réel.
  mirror-interval-minutes: 5

# ── Vote ─────────────────────────────────────────────────────────────────────
# Les récompenses vivent dans vote/recompenses.yml. Ici, seulement l'encart de
# vote du HUD client.
#
# L'encart n'apparaît que lorsqu'un vote est réellement ouvert. Le serveur de jeu
# ne sait pas le calculer — il ignore les sites déclarés et leurs délais : c'est
# le site qui dépose la réponse dans `rc_vote_status` (voir sql/003-vote-status.sql
# côté RedConflictSite), et le pont la relit ici.
#
# Sans le pont site (site.enabled: false) ou sans cette table, l'encart reste
# simplement masqué : rien d'autre n'en dépend.
vote:
  # Relecture de rc_vote_status pour les joueurs connectés, en secondes (min. 15).
  # Pas besoin de descendre : ce qu'on transmet au client est une date limite,
  # qu'il compare lui-même à l'heure courante — l'encart apparaît tout seul le
  # moment venu. Ce passage ne sert qu'à rattraper un vote enregistré ailleurs ;
  # celui qui vient d'être validé par `rcvote` est poussé immédiatement.
  status-refresh-seconds: 60

# ── Sauvegarde automatique de la base (pendant que le serveur tourne) ─────────
# Ne s'active QUE sur l'hôte H2 (le serveur avec database.server.enabled: true = le Faction).
# Tout le travail est asynchrone : aucun lag. Produit Backup/Back_<date>.zip
# (h2_central.sql via SCRIPT TO) et purge les vieux backups.
# NB : si tu utilises CETTE sauvegarde, désinstalle la tâche planifiée Windows
# (Backup\register-backup-task.ps1 -Remove) pour ne pas faire double emploi.
backup:
  enabled: true
  # Intervalle entre deux sauvegardes automatiques, en HEURES (minimum 1). Ex : 6 = toutes les 6h.
  # La 1ère sauvegarde a lieu après un intervalle complet (pas à chaque redémarrage).
  interval-hours: 6
  # ── Purge automatique des anciennes sauvegardes (les plus vieilles sont supprimées) ──
  # Nombre MAXIMUM de sauvegardes conservées. Au-delà, les plus anciennes sont effacées. 0 = illimité.
  max-backups: 28
  # Supprime aussi les sauvegardes plus vieilles que N jours. 0 = désactivé.
  # Les deux critères s'appliquent (une sauvegarde part si elle dépasse l'un OU l'autre).
  retention-days: 14
  # Dossier de sortie. Relatif = par rapport au dossier de travail du serveur (la racine = Faction).
  folder: "Backup"

