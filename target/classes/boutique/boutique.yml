      commande: "lp user %player% permission settemp redconflict.furnace true %duree%"
      commande_perm: "lp user %player% permission set redconflict.furnace true"
      prix_monnaie: 2000
      prix_pb: 20
      prix_monnaie_perm: 10000
      prix_pb_perm: 100
      duree: 2592000
    # Le noeud vendu est redconflict.nv, teste par /vision. Le nom de l'article
    # affiche les trois facons de l'appeler : les joueurs cherchaient « /nv » ou
    # « /nightvision » dans la boutique et repartaient en croyant que la commande
    # n'y etait pas.
    - id: "vision"
      nom: "&fCommande /nightvision (/nv)"
      icone: ENDER_EYE
      description:
        - "&7Vision nocturne permanente"
        - "&7Commande : &f/nightvision &7- alias &f/nv &7et &f/vision"
        - "&8Permission : redconflict.nv"
      commande: "lp user %player% permission settemp redconflict.nv true %duree%"
      commande_perm: "lp user %player% permission set redconflict.nv true"
      prix_monnaie: 2000
      prix_pb: 20
      prix_monnaie_perm: 10000
      prix_pb_perm: 100
      duree: 2592000
    - id: "repairall"
      nom: "&eCommande /repairall"
      icone: ANVIL
      description:
        - "&7Repare tout votre stuff"
        - "&8Permission : redconflict.repair"
      commande: "lp user %player% permission settemp redconflict.repair true %duree%"
      commande_perm: "lp user %player% permission set redconflict.repair true"
      prix_monnaie: 5000
      prix_pb: 50
      prix_monnaie_perm: 25000
      prix_pb_perm: 250
      duree: 2592000
    - id: "back"
      nom: "&aCommande /back"
      icone: COMPASS
      description:
        - "&7Retour a la derniere position"
        - "&8Permission : redconflict.back"
      commande: "lp user %player% permission settemp redconflict.back true %duree%"
      commande_perm: "lp user %player% permission set redconflict.back true"
      prix_monnaie: 3000
      prix_pb: 30
      prix_monnaie_perm: 15000
      prix_pb_perm: 150
      duree: 2592000
    - id: "feed"
      nom: "&6Commande /feed"
      icone: COOKED_BEEF
      description:
        - "&7Restaurez votre faim"
        - "&8Permission : redconflict.feed"
      commande: "lp user %player% permission settemp redconflict.feed true %duree%"
      commande_perm: "lp user %player% permission set redconflict.feed true"
      prix_monnaie: 2000
      prix_pb: 20
      prix_monnaie_perm: 10000
      prix_pb_perm: 100
      duree: 2592000
    - id: "near"
      nom: "&dCommande /near"
      icone: COMPASS
      description:
        - "&7Affiche les joueurs proches"
        - "&7Sans limite de rayon"
        - "&8Permissions : redconflict.near(.unlimited)"
      commandes:
        - "lp user %player% permission settemp redconflict.near true %duree%"
