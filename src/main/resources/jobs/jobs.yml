# ╔══════════════════════════════════════════════════════════════════╗
# ║       OriginsFightCore — Système de Métiers (jobs.yml)         ║
# ╚══════════════════════════════════════════════════════════════════╝

max-levels: 50

# Formule XP : xp_required(level) = floor(base * pow(factor, level - 1))
xp-formula:
  base: 100
  factor: 1.12

# Formule argent : money(level) = floor(money-base * pow(money-factor, level - 1))
# (peut être surchargé par la section rewards par métier)
money-formula:
  base: 200
  factor: 1.18

# ── XP par action ──────────────────────────────────────────────────────────────
jobs:

  MINER:
    display: "Mineur"
    color: "§7"
    description: "Extrais des minerais pour gagner de l'expérience"
    actions:
      # Clé = nom Material Bukkit (ou MATERIAL:META pour les blocs custom)
      COAL_ORE: 5
      IRON_ORE: 12
      LAPIS_ORE: 15
      REDSTONE_ORE: 15
      QUARTZ_ORE: 18
      GOLD_ORE: 20
      DIAMOND_ORE: 50
      EMERALD_ORE: 45
      RUBY_ORE: 60
      COBALT_ORE: 55

  FARMER:
    display: "Agriculteur"
    color: "§a"
    description: "Cultive les terres et plante des graines pour progresser"
    actions:
      # "break" = casser le bloc, "place" = le poser
      break:
        "CROPS:7": 8         # blé mûr (data value 7)
        SUGAR_CANE: 5
        CACTUS: 5
        "CARROT:7": 10       # carottes mûres
        "POTATO:7": 10       # pommes de terre mûres
      place:
        SEEDS: 2
        SUGAR_CANE: 1
        CACTUS: 1
        CARROT_ITEM: 2
        POTATO_ITEM: 2

  ARTISAN:
    display: "Artisan"
    color: "§6"
    description: "Fabrique des items, brasse des potions et enchante"
    actions:
      craft: 3          # XP par item crafté (hors blacklist)
      brew: 20          # XP par potion brassée
      enchant: 25       # XP par enchantement
      anvil: 15         # XP par utilisation de l'enclume
    # Crafts trop simples : aucune XP accordée pour ces résultats
    craft-blacklist:
      - WORKBENCH         # Table de craft
      - FURNACE           # Four
      - CHEST             # Coffre
      - TRAPPED_CHEST     # Coffre piégé
      - STICK             # Bâton
      - TORCH             # Torche
      - LADDER            # Échelle
      - WOOD              # Planches (toutes essences via metadata)
      - WOOD_STAIRS       # Escaliers bois (chêne)
      - SPRUCE_WOOD_STAIRS
      - BIRCH_WOOD_STAIRS
      - JUNGLE_WOOD_STAIRS
      - ACACIA_STAIRS
      - DARK_OAK_STAIRS
      - WOOD_STEP         # Dalles bois
      - FENCE             # Barrière bois (chêne)
      - SPRUCE_FENCE
      - BIRCH_FENCE
      - JUNGLE_FENCE
      - ACACIA_FENCE
      - DARK_OAK_FENCE
      - FENCE_GATE
      - SPRUCE_FENCE_GATE
      - BIRCH_FENCE_GATE
      - JUNGLE_FENCE_GATE
      - ACACIA_FENCE_GATE
      - DARK_OAK_FENCE_GATE
      - WOOD_DOOR         # Portes bois
      - SPRUCE_DOOR_ITEM
      - BIRCH_DOOR_ITEM
      - JUNGLE_DOOR_ITEM
      - ACACIA_DOOR_ITEM
      - DARK_OAK_DOOR_ITEM
      - SIGN              # Panneau
      - BED               # Lit
      - BOAT              # Bateau
      - WOOD_PLATE        # Plaque de pression bois
      - WOOD_BUTTON       # Bouton bois
      - BOWL              # Bol
      - WOOD_SWORD        # Outils en bois
      - WOOD_SPADE
      - WOOD_PICKAXE
      - WOOD_AXE
      - WOOD_HOE
      - STONE_SWORD       # Outils en pierre
      - STONE_SPADE
      - STONE_PICKAXE
      - STONE_AXE
      - STONE_HOE
      - COBBLESTONE_STAIRS
      - STEP              # Dalles pierre/cobble/brique
      - COBBLESTONE_WALL
      - STONE_BUTTON
      - STONE_PLATE

